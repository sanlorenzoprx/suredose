name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, build]
    env:
      # A verification build must never apply migrations to the live database.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  browser:
    name: Verify (browser-${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, d1]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: suredose_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: suredose_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suredose_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable job-local service. No repository/production secrets are used.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://suredose_test:isolated_ci_only@127.0.0.1:5432/suredose_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare screenshot directory
        run: |
          sudo mkdir -p /workspace/screenshots
          sudo chown "$(id -u):$(id -g)" /workspace/screenshots
      - run: npm run build
      - name: Configure isolated Worker preview database
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          if (process.env.DATABASE_URL) {
            const url = new URL(process.env.DATABASE_URL);
            if (url.hostname !== '127.0.0.1' || url.pathname !== '/suredose_test') throw new Error('CI database must be isolated');
          }
          // Wrangler reads local vars beside the original root config, even when redirected.
          writeFileSync('.dev.vars', `DATABASE_URL=${process.env.DATABASE_URL}\nBETTER_AUTH_SECRET=${randomBytes(32).toString('hex')}\n`);
          JS
      - name: Prepare isolated local D1 schema
        if: matrix.database == 'd1'
        run: npm run db:migrate:d1:local
      - name: Start development preview
        run: |
          npm run dev > /tmp/suredose-dev.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/suredose-dev.log
          exit 1
      - name: Check desktop and mobile rendering
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8080/ /workspace/screenshots/suredose-dev.png
      - name: Check schedule and saved-photo regression
        run: node scripts/suredose-ui-smoke.mjs http://127.0.0.1:8080/
      - name: Start Cloudflare build preview
        run: npm run preview:restart
      - name: Check Cloudflare build rendering
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/suredose-built.png --baseline /workspace/screenshots/suredose-dev.json
      - name: Check Cloudflare schedule and saved-photo regression
        run: node scripts/suredose-ui-smoke.mjs http://127.0.0.1:8081/
      - name: Show preview diagnostics on failure
        if: failure()
        run: |
          for log in /tmp/suredose-dev.log .grok/preview.log; do
            if [ -f "$log" ]; then tail -n 120 "$log"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suredose-browser-evidence-${{ matrix.database }}
          path: |
            /workspace/screenshots/
            screenshots/
          if-no-files-found: warn
